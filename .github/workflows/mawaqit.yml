name: Horaires Mawaqit
# Chaque jour, relit la page Mawaqit de la mosquée et met à jour data/mawaqit.json
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    paths: ['mosquee.json', 'scripts/mawaqit.mjs']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/mawaqit.mjs
      - name: Enregistrer si changé
        run: |
          git config user.name "mawaqit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mawaqit.json
          git diff --cached --quiet || (git commit -m "Horaires Mawaqit mis à jour" && git push)
